version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aurum_postgres
    restart: always
    environment:
      POSTGRES_USER: aurum_user
      POSTGRES_PASSWORD: aurum_password
      POSTGRES_DB: aurum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum_user -d aurum_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurum_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql://aurum_user:aurum_password@postgres:5432/aurum_db
      - PORT=8000
      - NODE_ENV=production
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: >
      sh -c "npx prisma db push --schema=prisma/schema.postgresql.prisma &&
             DATABASE_URL=postgresql://aurum_user:aurum_password@postgres:5432/aurum_db npx tsx src/scripts/seed.ts &&
             node dist/main.js"

volumes:
  postgres_data:
